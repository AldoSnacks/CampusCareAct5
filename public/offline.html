<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#065f46">
  <title>CampusCare · Sin conexión</title>
  <style>
    :root { --g950: #022c22; --g700: #047857; --g500: #10b981; --g100: #d1fae5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
      background: radial-gradient(circle at 15% 20%, rgba(163, 230, 53, .22), transparent 40%), linear-gradient(160deg, var(--g950), #064e3b 50%, var(--g700));
    }
    main { max-width: 440px; text-align: center; display: grid; gap: 16px; justify-items: center; }
    img { width: 84px; height: 84px; border-radius: 22px; background: #fff; padding: 6px; }
    h1 { margin: 0; font-size: 1.7rem; }
    p { margin: 0; opacity: .88; line-height: 1.55; }
    button { margin-top: 6px; padding: 12px 22px; border: 0; border-radius: 12px; background: #fff; color: var(--g700); font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="CampusCare">
    <h1>Estás sin conexión</h1>
    <p>No pudimos conectar con el servidor de CampusCare. Revisa tu internet o tu red Wi-Fi; cuando vuelva la conexión podrás seguir reportando incidencias.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
